<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="music-player">

        <!-- ==============================
             TITLE
        =============================== -->

        <h1>Music Player</h1>


        <!-- ==============================
             ALBUM COVER
        =============================== -->

        <img
            id="cover"
            src="assets/images/song1.jpg"
            alt="Album Cover"
        >


        <!-- ==============================
             SONG INFORMATION
        =============================== -->

        <h2 id="title">Song One</h2>

        <p id="artist">Artist One</p>


        <!-- ==============================
             PROGRESS BAR
        =============================== -->

        <div class="progress-container">

            <span id="current-time">0:00</span>

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
            >

            <span id="duration">0:00</span>

        </div>


        <!-- ==============================
             VOLUME CONTROL
        =============================== -->

        <div class="volume-container">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <!-- ==============================
             MUSIC CONTROLS
        =============================== -->

        <div class="controls">

            <button id="prev" type="button">
                ⏮
            </button>

            <button id="play" type="button">
                ▶
            </button>

            <button id="next" type="button">
                ⏭
            </button>

        </div>


        <!-- ==============================
             PLAYLIST
        =============================== -->

        <div class="playlist">

            <h3>Playlist</h3>

            <ul id="playlist"></ul>

        </div>

    </div>


    <!-- ==============================
         AUDIO ELEMENT
    =============================== -->

    <audio id="audio"></audio>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="script.js"></script>

</body>

</html>
